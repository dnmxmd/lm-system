# Runs against the PostgreSQL and Redis from docker-compose, so the migration, the SQL and the
# cache serializer are exercised as they will be in production rather than against stand-ins.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  mail:
    host: ""

lms:
  payments:
    allow-simulated-settlement: true
  rate-limit:
    enabled: false
  security:
    jwt:
      secret: test-secret-key-that-is-definitely-long-enough
