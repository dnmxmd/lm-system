# Runs the real migration, then asks Hibernate to validate the entity mappings against the schema
# it produced. H2 is in PostgreSQL mode, so the migration is executed as written.
spring:
  datasource:
    url: jdbc:h2:mem:schema;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: none
  mail:
    host: ""

lms:
  outbox:
    # Tests call the relay a pass at a time; automatic delivery would race them.
    auto-delivery: false
  payments:
    allow-simulated-settlement: true
  rate-limit:
    enabled: false
  security:
    jwt:
      secret: test-secret-key-that-is-definitely-long-enough
